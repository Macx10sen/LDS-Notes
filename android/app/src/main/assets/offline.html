<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDNotebook</title>
<style>
  :root { --paper: #f7f2e8; --ink: #2b2925; --muted: #736d63; --card: #fbf8f1; --rule: #d6cfc1; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1b1a18; --ink: #ece6da; --muted: #a39b8e; --card: #24221f; --rule: #3d3a35; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 -apple-system, Roboto, sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { font-family: Georgia, serif; font-weight: 400; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; }
  p { color: var(--muted); max-width: 30ch; margin: 0 auto 20px; }
  button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 10px 22px; }
</style>
</head>
<body>
  <main>
    <h1>Latter Day Notebook</h1>
    <p>Connect to the internet once to finish setting up. After that, the notebook works offline.</p>
    <button type="button" onclick="location.href='https://macx10sen.github.io/LDS-Notes/'">Try again</button>
  </main>
</body>
</html>
