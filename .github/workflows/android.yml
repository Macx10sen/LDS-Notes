name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives in two repository secrets, never in the repo:
      # ANDROID_KEYSTORE_BASE64 (the keystore file, base64) and ANDROID_KEYSTORE_PASSWORD.
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ldnotebook.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ldnotebook.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret; building a test-signed APK that won't be published."
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LDNotebook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LDNotebook-apk
          path: LDNotebook.apk

      # On main, publish it so the latest APK is always at
      # https://github.com/Macx10sen/LDS-Notes/releases/latest/download/LDNotebook.apk
      - name: Publish a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ github.run_number }}"
          gh release create "$tag" LDNotebook.apk \
            --title "LDNotebook for Android (build ${{ github.run_number }})" \
            --notes "Download LDNotebook.apk on your Android phone and open it to install or update. Your notes stay on your phone." \
            --latest
