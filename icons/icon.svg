    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe2c7"/>
      <stop offset="0.85" stop-color="#fbf5e8"/>
      <stop offset="1" stop-color="#d9c29c"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9c29c"/>
      <stop offset="0.15" stop-color="#f7efdf"/>
      <stop offset="1" stop-color="#e3d1ae"/>
    </linearGradient>
    <pattern id="hatch" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#4a3221" stroke-width="1.3"/>
    </pattern>
    <pattern id="hatch2" width="4.5" height="4.5" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#4a3221" stroke-width="1.1"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
