<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="256" cy="150" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7eedb"/>
      <stop offset="0.45" stop-color="#e6d4b2"/>
      <stop offset="1" stop-color="#c9ad80"/>
    </radialGradient>
    <radialGradient id="halo" cx="256" cy="112" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <!-- marble lit from the upper left -->
    <linearGradient id="stone" x1="150" y1="120" x2="380" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf5e8"/>
      <stop offset="0.55" stop-color="#eee0c4"/>
      <stop offset="1" stop-color="#cdb28a"/>
    </linearGradient>
    <linearGradient id="hairG" x1="230" y1="80" x2="285" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8946c"/>
      <stop offset="1" stop-color="#6e4e33"/>
